<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f6f8fc">
<title>2027届校招机会看板 · 英语专业</title>
<style>
:root{
  --blue:#3159d8;--blue-hover:#254bc3;--blue-soft:#eef3ff;--blue-line:#d9e3ff;
  --navy:#15213b;--text:#25324a;--muted:#718096;--muted-2:#98a2b3;
  --bg:#f5f7fb;--card:#fff;--line:#e7ebf2;--line-strong:#d9dfeb;
  --green:#16825d;--greenbg:#ecf8f3;--amber:#a46700;--amberbg:#fff7e7;
  --red:#b42318;--redbg:#fff1f0;--shadow:0 8px 28px rgba(35,51,89,.055);
  --shadow-hover:0 14px 34px rgba(35,51,89,.10);--radius:16px;--radius-sm:10px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:linear-gradient(180deg,#f8faff 0,#f5f7fb 260px,#f5f7fb 100%);color:var(--text);font:14px/1.6 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}.page{max-width:1380px;margin:auto;padding:0 24px 56px}

/* Top navigation */
.topbar{position:sticky;top:0;z-index:20;margin:0 -24px;padding:11px 24px;background:rgba(248,250,255,.88);backdrop-filter:blur(18px);border-bottom:1px solid rgba(217,223,235,.75)}
.toprow{max-width:1380px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand{font-weight:850;font-size:16px;letter-spacing:-.2px;color:var(--navy);white-space:nowrap;display:flex;align-items:center;gap:10px}
.brand:before{content:"";width:10px;height:10px;border-radius:3px;background:linear-gradient(135deg,#3159d8,#6387ef);box-shadow:0 0 0 4px #e8eeff}
.nav{display:flex;gap:6px;overflow:auto;padding:2px}
.nav button{border:0;background:transparent;border-radius:10px;padding:8px 13px;color:#667085;white-space:nowrap;cursor:pointer;font-weight:650;transition:.18s ease}
.nav button:hover{background:#fff;color:var(--navy)}
.nav button.active{background:#fff;color:var(--blue);box-shadow:0 3px 14px rgba(47,75,145,.09),inset 0 0 0 1px #e8ebf3}

/* Hero */
.hero{display:flex;justify-content:space-between;align-items:center;gap:24px;padding:34px 2px 22px}
.hero>div:first-child{min-width:0}.hero h1{margin:0 0 8px;font-size:32px;line-height:1.15;letter-spacing:-.7px;color:var(--navy);font-weight:850}
.subtitle{color:var(--muted);max-width:920px;font-size:13px}.update{background:rgba(255,255,255,.86);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:225px;box-shadow:var(--shadow)}
.update b{display:block;color:#344054}.update small{display:block;color:var(--muted);margin-top:2px}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--green);margin-right:7px;box-shadow:0 0 0 3px #e4f6ef}.dot.warn{background:#d99a1b;box-shadow:0 0 0 3px #fff2d5}

/* KPI cards */
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:16px}.stat{position:relative;overflow:hidden;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:15px;padding:17px 18px;box-shadow:var(--shadow);transition:.18s ease}.stat:hover{transform:translateY(-1px);box-shadow:var(--shadow-hover)}.stat:after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,#dce5ff,transparent)}.stat strong{display:block;font-size:27px;line-height:1.15;margin-bottom:4px;color:var(--navy);letter-spacing:-.6px}.stat span{font-size:12px;color:var(--muted)}

/* Shared cards and controls */
.card{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.filters{display:grid;grid-template-columns:2.1fr repeat(5,1fr) auto;gap:10px;padding:14px;margin:16px 0 13px;align-items:end}.field label{display:block;font-size:11px;font-weight:650;color:#7c879b;margin:0 0 5px 2px}.field input,.field select,.status,.offer input,.offer textarea{width:100%;border:1px solid var(--line-strong);background:#fff;border-radius:9px;padding:9px 10px;color:var(--text);outline:none;transition:.18s ease}.field input:focus,.field select:focus,.status:focus,.offer input:focus,.offer textarea:focus{border-color:#9db2ef;box-shadow:0 0 0 3px #eef3ff}.field input::placeholder{color:#a6aebe}
.btn{border:1px solid var(--line-strong);background:#fff;color:#475467;border-radius:9px;padding:8px 12px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:5px;font-weight:650;transition:.16s ease}.btn:hover{border-color:#b7c1d5;background:#fafbfe;transform:translateY(-1px)}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 5px 14px rgba(49,89,216,.18)}.btn.primary:hover{background:var(--blue-hover);border-color:var(--blue-hover)}.btn.soft{background:var(--blue-soft);border-color:var(--blue-line);color:#3555ae}.btn.danger{color:var(--red)}

.ruleline{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:5px 2px 12px}.legend{display:flex;gap:7px;flex-wrap:wrap}.pill,.tag{display:inline-flex;align-items:center;border-radius:999px;padding:3px 9px;font-size:12px;background:#f6f8fb;border:1px solid #e8ebf1;color:#556176}.pill{font-weight:750}.pill.s{background:#edf3ff;border-color:#d7e3ff;color:#2858b6}.pill.a{background:#ecf8f3;border-color:#cdeee0;color:#147456}.pill.b{background:#fff7e6;border-color:#f1dfb5;color:#8a5b00}.pill.c{background:#f4f5f7;color:#667085}.notice{padding:11px 13px;border-radius:11px;margin:11px 0;background:var(--amberbg);border:1px solid #f2deb2;color:#7c5510}

/* Job list */
.summary{display:flex;justify-content:space-between;align-items:center;margin:14px 3px 9px}.summary b{font-size:14px;color:#344054}.joblist{display:grid;gap:11px}.job{position:relative;padding:19px 20px 18px 21px;display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:20px;transition:.18s ease;overflow:hidden}.job:before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 4px 4px 0;background:#e1e6ef}.job:has(.pill.s):before{background:#4e73e3}.job:has(.pill.a):before{background:#35a67d}.job:has(.pill.b):before{background:#e0a22f}.job:hover{border-color:#d7deea;box-shadow:var(--shadow-hover);transform:translateY(-1px)}.company{font-weight:720;color:#667085;font-size:13px}.jobtitle{font-size:19px;font-weight:830;margin:2px 0 8px;color:#17233d;letter-spacing:-.2px}.meta,.tags,.actions{display:flex;gap:7px;flex-wrap:wrap}.meta{font-size:12px;color:#7a869a}.meta span{display:inline-flex;align-items:center}.tags{margin-top:10px}.tag{border-radius:7px;padding:3px 7px;background:#f7f8fa}.tag.ok{background:var(--greenbg);border-color:#caebdf;color:var(--green)}.tag.warn{background:var(--amberbg);border-color:#efdcaf;color:var(--amber)}.tag.bad{background:var(--redbg);border-color:#ffd0cc;color:var(--red)}.match{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;text-align:right;border-left:1px solid #eef0f4;padding-left:18px}.level{font-size:25px;font-weight:850;color:var(--navy)}.level small{font-size:12px;color:var(--muted);font-weight:550;margin-left:4px}.matchreason{color:var(--muted);font-size:12px;margin:5px 0 11px;max-width:240px}.status{min-width:102px;padding:8px 9px}.empty{padding:40px 24px;text-align:center;color:var(--muted)}

/* Pipeline */
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 14px;flex-wrap:wrap}.toolbar .actions{gap:7px}.pipeline{display:grid;grid-template-columns:repeat(6,1fr);gap:11px}.lane{background:#eef2f8;border:1px solid #e3e8f0;border-radius:13px;padding:10px;min-height:210px}.lane h3{margin:2px 2px 10px;font-size:12px;color:#536174}.mini{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;cursor:pointer;box-shadow:0 2px 8px rgba(32,42,76,.035);transition:.16s ease}.mini:hover{transform:translateY(-1px);border-color:#d5ddeb}.mini b{display:block;color:#26344e}.mini small{color:var(--muted)}

/* Stats / Offer */
.charts{display:grid;grid-template-columns:1fr 1fr;gap:14px}.chart{padding:18px}.chart h3{margin:0 0 15px;color:#344054}.bar{display:grid;grid-template-columns:125px 1fr 42px;align-items:center;gap:9px;margin:11px 0}.barbg{height:8px;background:#edf0f5;border-radius:999px;overflow:hidden}.barfill{height:100%;background:linear-gradient(90deg,#3159d8,#6685e5);border-radius:999px}.offers{display:grid;grid-template-columns:340px 1fr;gap:14px}.offer{padding:18px}.offer .grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.offer .wide{grid-column:1/-1}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.table th{font-size:12px;color:#667085;background:#fafbfc}

/* Help + modal */
.help{margin-top:24px;padding:18px 19px}.help h3{margin:0 0 8px;color:#344054}.help ul{margin:7px 0 0;padding-left:20px;color:var(--muted)}.help li{margin:4px 0}.modalbg{position:fixed;inset:0;background:rgba(15,23,42,.48);backdrop-filter:blur(4px);display:grid;place-items:center;padding:18px;z-index:30}.modal{background:#fff;width:min(800px,100%);max-height:88vh;overflow:auto;border-radius:18px;padding:20px;box-shadow:0 30px 80px rgba(16,24,40,.25)}.close{float:right;width:34px;height:34px;border:0;border-radius:9px;background:#f2f4f7;color:#667085;font-size:20px;cursor:pointer}.detailgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:13px 0}.detailbox{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:11px}.detailbox b{display:block;color:#344054}.muted{color:var(--muted)}.hidden{display:none!important}

@media(max-width:1160px){.stats{grid-template-columns:repeat(3,1fr)}.filters{grid-template-columns:repeat(3,1fr)}.pipeline{grid-template-columns:repeat(3,1fr)}.job{grid-template-columns:minmax(0,1fr) 245px}}
@media(max-width:780px){body{background:#f6f8fc}.page{padding:0 12px 36px}.topbar{margin:0 -12px;padding:10px 12px}.toprow{gap:9px}.brand{font-size:14px}.brand:before{display:none}.toprow,.hero{flex-direction:column;align-items:stretch}.hero{padding:24px 0 16px}.hero h1{font-size:26px}.update{min-width:0}.stats{grid-template-columns:repeat(2,1fr);gap:9px}.stat{padding:14px}.stat strong{font-size:24px}.filters{grid-template-columns:1fr 1fr;padding:11px}.job{grid-template-columns:1fr;padding:17px}.match{align-items:flex-start;text-align:left;border-left:0;border-top:1px solid #eef0f4;padding:13px 0 0}.matchreason{max-width:none}.pipeline{grid-template-columns:1fr}.charts,.offers{grid-template-columns:1fr}.offer .grid{grid-template-columns:1fr}.offer .wide{grid-column:auto}.detailgrid{grid-template-columns:1fr}.ruleline,.summary{align-items:flex-start;flex-direction:column}.nav{width:100%}.nav button{padding:7px 10px}.jobtitle{font-size:18px}}
@media(max-width:480px){.stats{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr}.actions{width:100%}.job .actions .btn,.job .actions .status{flex:1}.hero h1{font-size:24px}}

/* Decision-first job card (was injected at runtime by ui-v1.2-patch.js) */
.decision-quick{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.decision-quick-label{font-size:12px;color:var(--muted);font-weight:700;margin-right:2px}.quick-btn{border:1px solid var(--line-strong);background:#fff;color:#556176;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer;transition:.15s ease}.quick-btn:hover{border-color:#b8c3d8;background:#fafbff}.quick-btn.active{background:var(--blue-soft);border-color:var(--blue-line);color:var(--blue)}.quick-btn.official.active{background:var(--greenbg);border-color:#cdeee0;color:var(--green)}
.decision-grid{display:grid;grid-template-columns:1.25fr .85fr .85fr;gap:8px;margin:12px 0 0}.decision-cell{background:#f8faff;border:1px solid #e9edf5;border-radius:10px;padding:8px 10px;min-width:0}.decision-cell span{display:block;font-size:10px;color:#8b95a7;font-weight:700;letter-spacing:.2px;margin-bottom:1px}.decision-cell b{display:block;font-size:13px;color:#2c3b58;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.decision-cell.fit b{color:#3159d8}.decision-cell.priority b{color:#16825d}
.decision-why{display:flex;gap:8px;align-items:flex-start;margin-top:9px;padding:8px 10px;border-radius:10px;background:#fbfcfe;border:1px solid #edf0f5;color:#647087;font-size:12px}.decision-why strong{color:#46536b;white-space:nowrap}.decision-why span{min-width:0}
.job .tags{margin-top:8px}.job .tags .tag{opacity:.82;font-size:11px}.job .tags .tag[data-secondary="1"]{background:#fafbfc;border-color:#edf0f4;color:#8a94a6}.job .tags .tag[data-risk="1"]{opacity:1;background:var(--amberbg);border-color:#efdcaf;color:var(--amber)}
.job .match{min-width:0}.job .match .level{display:flex;align-items:center;justify-content:flex-end;gap:7px;flex-wrap:wrap}.job .actions{justify-content:flex-end}.job .actions .btn.primary{min-width:88px}
.summary{padding:0 2px}.summary b{font-size:15px}
@media(max-width:780px){.decision-grid{grid-template-columns:1fr 1fr}.decision-cell:first-child{grid-column:1/-1}.job .match .level{justify-content:flex-start}.job .actions{justify-content:flex-start}.decision-why{line-height:1.5}}
@media(max-width:480px){.decision-grid{grid-template-columns:1fr}.decision-cell:first-child{grid-column:auto}.quick-btn{padding:5px 9px}}

/* Salary / company-risk intelligence (was injected at runtime by intelligence-v1.3-patch.js) */
.intel-section{margin-top:14px}.intel-note{font-size:12px;color:var(--muted);margin:6px 0 10px}.intel-event{margin:7px 0}.intel-event-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.intel-event-title{font-weight:700;margin-top:5px}.intel-event-summary{margin-top:4px;line-height:1.55}.intel-event-foot{font-size:12px;margin-top:5px}.intel-link{color:var(--blue);text-decoration:none}.intel-link:hover{text-decoration:underline}
.intel-risk-source-guide{margin:8px 0 10px;border:1px solid var(--line);border-radius:10px;background:#fafbfe}.intel-risk-source-guide summary{cursor:pointer;list-style:none;padding:8px 10px;font-size:12px;font-weight:700;color:#5f6b80}.intel-risk-source-guide summary::-webkit-details-marker{display:none}.intel-risk-source-guide summary:before{content:"＋";display:inline-block;width:18px;color:#7b879a}.intel-risk-source-guide[open] summary:before{content:"－"}.intel-risk-source-body{padding:0 9px 9px;display:grid;gap:7px}.intel-risk-source-row{background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 9px}.intel-risk-source-row b{display:block;font-size:12px;color:#344054;margin-bottom:2px}.intel-risk-source-row .muted{font-size:12px;line-height:1.5}.intel-risk-source-foot{font-size:12px;line-height:1.55;color:var(--muted);margin:2px 1px 0}
</style>
</head>
<body>
<div id="app"></div>
<script src="./scoring.js"></script>
<script src="./app.js"></script>
</body>
</html>
