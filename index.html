function fitcards(a,type){return`<div class="fitgrid">${a.slice(0,8).map(x=>`<div class="card fit" ${type==='co'?`data-co="${e(x.name)}"`:`data-ro="${e(x.name)}"`}><span class="v">${x.fit}</span><b>${e(x.name)}</b><small>${type==='co'?`最佳 ${x.best} · A/S ${x.high}/${x.j.length}${x.official?` · 官网 ${x.official}`:' · 待官网核验'}`:`最佳 ${x.best} · 平均 ${x.avg} · ${x.j.length} 岗`}</small>${type==='co'?`<small>最佳：${e(x.j[0].title)}</small>`:''}</div>`).join('')}</div>`}
function card(j){let f=j.candidateFit||{};return`<article class="card job"><div><div class="company">${e(j.company)}</div><div class="title">${e(j.title)}</div><div class="meta"><span>📍 ${e(j.city||'待核')}</span><span>🧭 ${e(j._dir)}</span><span>🗓 ${e(j.deadline||'待核')}</span><span>${e(j.source||'来源待核')}</span></div><div class="tags" style="margin-top:8px"><span class="tag ${j.sourceType==='official'?'ok':'warn'}">${j.sourceType==='official'?'官方来源':'二手来源 · 需官网核验'}</span>${(f.warnings||[]).slice(0,1).map(x=>`<span class="tag warn">△ ${e(x)}</span>`).join('')}</div></div><div class="score"><div><strong>${j._s}</strong><small>/100 · ${j._t}档</small></div><div class="acts">${j.sourceUrl?`<a class="btn" target="_blank" rel="noopener" href="${e(j.sourceUrl)}">${j.sourceType==='official'?'官网职位':'查看二手来源'}</a>`:''}<button class="btn" data-detail="${e(j.id)}">匹配分析</button><select class="status" data-status="${e(j.id)}"><option value="">加入投递</option>${P.map(x=>`<option ${S.status[j.id]===x?'selected':''}>${x}</option>`).join('')}</select></div></div></article>`}
function jobs(){let b=base(),l=list(),ds=dirs(b),cs=cos(b),cities=['全部',...u(b.map(x=>x.city))],roles=['全部',...ds.map(x=>x.name)];return`<section class="hero"><div><h1>今天哪些岗位值得投？</h1><p class="muted">岗位、方向、公司全部按候选人匹配度降序；公司名气和岗位数量不直接加分。</p></div>${sync()}</section>${S.mode==='fallback'?'<div class="notice">实时岗位池不可用，当前显示回退样例。</div>':''}<section class="stats">${[['有效岗位',b.length],['S档',b.filter(x=>x._t==='S').length],['A档',b.filter(x=>x._t==='A').length],['公司',cs.length],['城市',u(b.map(x=>x.city)).length]].map(x=>`<div class="card stat"><div class="num">${x[1]}</div><div class="lab">${x[0]}</div></div>`).join('')}</section><section class="section"><div class="head"><div><h2>方向优先级 · 按匹配度</h2><p>最佳岗位60% + Top3平均30% + 高匹配占比10%</p></div></div>${fitcards(ds,'ro')}</section><section class="section"><div class="head"><div><h2>公司匹配度 TOP 8</h2><p>只从当前有效2027岗位推导；官网/二手只标可信度，不抬高匹配分</p></div></div>${fitcards(cs,'co')}</section><section class="card tools"><div><label>关键词</label><input id="q" value="${e(S.f.q)}" placeholder="公司 / 岗位 / 技能"></div><div><label>城市</label><select id="city">${cities.map(x=>`<option ${S.f.city===x?'selected':''}>${e(x)}</option>`).join('')}</select></div><div><label>岗位方向</label><select id="role">${roles.map(x=>`<option ${S.f.role===x?'selected':''}>${e(x)}</option>`).join('')}</select></div><div><label>匹配档</label><select id="tier">${['全部','S','A','B','C'].map(x=>`<option ${S.f.tier===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>来源</label><select id="source">${['全部','官方','二手'].map(x=>`<option ${S.f.source===x?'selected':''}>${x}</option>`).join('')}</select></div><button class="btn" id="reset">重置</button></section><div class="result"><b>${l.length} 个岗位</b><span class="muted">匹配度从高到低</span></div><section class="jobs">${l.slice(0,S.n).map(card).join('')||'<div class="card stat">没有符合条件的岗位</div>'}</section>${l.length>S.n?'<p style="text-align:center"><button class="btn" id="more">加载更多</button></p>':''}`}
function pipe(){let b=base().filter(x=>S.status[x.id]);return`<section class="hero"><div><h1>我的投递</h1><p class="muted">每个状态内仍按匹配度排列。</p></div></section><section class="lanes">${P.map(p=>{let a=b.filter(x=>S.status[x.id]===p);return`<div class="lane"><h3>${p} · ${a.length}</h3>${a.map(x=>`<div class="mini" data-detail="${x.id}"><b>${e(x.title)}</b><div class="muted">${e(x.company)} · ${x._s}</div></div>`).join('')||'<span class="muted">暂无</span>'}</div>`}).join('')}</section>`}
function bars(a,max){let m=max||Math.max(1,...a.map(x=>x[1]));return a.map(x=>`<div class="bar"><span>${e(x[0])}</span><div class="bg"><div class="fill" style="width:${Math.min(100,x[1]/m*100)}%"></div></div><b>${x[1]}</b></div>`).join('')}
function stats(){let b=base(),ds=dirs(b),cs=cos(b);return`<section class="hero"><div><h1>统计分析</h1><p class="muted">把“数量”和“匹配度”分开看。</p></div>${sync()}</section><section class="charts"><div class="card chart"><h3>匹配等级</h3>${bars(['S','A','B','C'].map(t=>[t+'档',b.filter(x=>x._t===t).length]))}</div><div class="card chart"><h3>来源</h3>${bars([['官方',b.filter(x=>x.sourceType==='official').length],['二手',b.filter(x=>x.sourceType!=='official').length]])}</div><div class="card chart"><h3>方向 · 匹配分</h3>${bars(ds.slice(0,8).map(x=>[x.name,x.fit]),100)}</div><div class="card chart"><h3>公司 · 匹配分</h3>${bars(cs.slice(0,8).map(x=>[x.name,x.fit]),100)}</div></section>`}
function os(o){return Math.round((+o.fit*.3 + +o.growth*.25 + +o.comp*.2 + +o.cityScore*.15 + +o.pace*.1)*10)/10}
function offers(){return`<section class="hero"><div><h1>Offer 对比</h1><p class="muted">匹配30% · 成长25% · 薪酬20% · 城市15% · 节奏10%</p></div></section><section class="offers"><form id="of" class="card offer"><div class="grid"><input class="wide" name="company" required placeholder="公司"><input class="wide" name="title" required placeholder="岗位"><input name="location" placeholder="城市"><input name="salary" placeholder="薪资">${[['fit','匹配'],['growth','成长'],['comp','薪酬'],['cityScore','城市'],['pace','节奏']].map(x=>`<div><label>${x[1]} 1–10</label><input name="${x[0]}" type="number" min="1" max="10" value="7"></div>`).join('')}<button class="btn primary wide">加入对比</button></div></form><div class="card offer table"><table><thead><tr><th>公司/岗位</th><th>城市</th><th>薪资</th><th>综合</th><th></th></tr></thead><tbody>${S.offers.length?[...S.offers].sort((a,b)=>os(b)-os(a)).map(o=>`<tr><td><b>${e(o.company)}</b><br>${e(o.title)}</td><td>${e(o.location||'-')}</td><td>${e(o.salary||'-')}</td><td><b>${os(o)}</b></td><td><button class="btn" data-del="${o.id}">删除</button></td></tr>`).join(''):'<tr><td colspan="5">暂无</td></tr>'}</tbody></table></div></section>`}
function modal(){if(!S.sel)return'';let j=base().find(x=>x.id===S.sel);if(!j)return'';let z=j._z,f=j.candidateFit||{},rows=[['职责/方向',z.parts.d,30],['专业/英语',z.parts.m,20],['经历可迁移',z.parts.e,25],['职业方向',z.parts.c,20],['信息质量',z.parts.q,5]];return`<div class="modalbg" data-close="1"><div class="modal" onclick="event.stopPropagation()"><button class="close" data-close="1">×</button><div class="company">${e(j.company)}</div><h2>${e(j.title)}</h2><div class="box"><b>${j._t}档 · ${j._s}/100 · ${e(j._dir)}</b><br>${e(f.major?.label||f.major?.verdict||'专业待核')} · ${e(f.responsibility?.verdict||'职责待核')}</div>${rows.map(r=>`<div class="result"><span>${r[0]}</span><b>${r[1]}/${r[2]}</b></div>`).join('')}<h3>风险/门槛</h3><div class="tags">${[...(z.gate.r||[]),...z.ris,...(f.warnings||[])].map(x=>`<span class="tag warn">△ ${e(x)}</span>`).join('')||'暂无明显风险'}</div>${j.sourceUrl?`<p><a class="btn primary" target="_blank" rel="noopener" href="${e(j.sourceUrl)}">${j.sourceType==='official'?'打开官网职位':'查看二手来源（投递前回官网）'}</a></p>`:''}</div></div>`}
function render(){app.innerHTML=shell(S.tab==='jobs'?jobs():S.tab==='pipe'?pipe():S.tab==='stats'?stats():offers())}
function parse(t){let s=t.indexOf('export const liveJobs ='),a=t.indexOf('[',s),m=t.indexOf('export const discoveryMeta',a),x=t.slice(a,m),q=x.lastIndexOf('];');if(s<0||a<0||m<0||q<0)throw Error('数据格式异常');let arr=JSON.parse(x.slice(0,q+1)),meta={},ms=t.indexOf('{',m),me=t.lastIndexOf('};');if(ms>0&&me>ms)try{meta=JSON.parse(t.slice(ms,me+1))}catch{}return{arr,meta}}
async function load(){for(let url of URLS)try{let c=new AbortController,t=setTimeout(()=>c.abort(),8000),r=await fetch(url,{cache:'no-store',signal:c.signal});clearTimeout(t);if(!r.ok)throw Error(r.status);let{arr,meta}=parse(await r.text());if(!arr.length)throw Error('empty');S.jobs=arr;S.updated=meta.updatedAt||arr[0]?.discoveredAt||'';S.mode='live';S.msg=`已读取 ${arr.length} 条岗位，已重新计算匹配度。`;render();return}catch(x){console.warn(x)}S.jobs=FB;S.mode='fallback';S.msg='实时岗位源不可用';render()}
app.addEventListener('click',x=>{let t=x.target.closest('[data-tab]')?.dataset.tab;if(t){S.tab=t;S.sel=null;render();return}let d=x.target.closest('[data-detail]')?.dataset.detail;if(d){S.sel=d;render();return}if(x.target.closest('[data-close]')){S.sel=null;render();return}let co=x.target.closest('[data-co]')?.dataset.co;if(co){S.f.q=co;render();return}let ro=x.target.closest('[data-ro]')?.dataset.ro;if(ro){S.f.role=ro;render();return}if(x.target.id==='reset'){S.f={q:'',city:'全部',role:'全部',tier:'全部',source:'全部'};render();return}if(x.target.id==='more'){S.n+=30;render();return}let del=x.target.closest('[data-del]')?.dataset.del;if(del){S.offers=S.offers.filter(o=>o.id!==del);save();render()}});
app.addEventListener('input',x=>{if(x.target.id==='q'){S.f.q=x.target.value;let p=x.target.selectionStart;render();let q=document.getElementById('q');q?.focus();q?.setSelectionRange(p,p)}});
app.addEventListener('change',x=>{if(['city','role','tier','source'].includes(x.target.id)){S.f[x.target.id]=x.target.value;render();return}let id=x.target.dataset.status;if(id!==undefined){x.target.value?S.status[id]=x.target.value:delete S.status[id];save();render()}});
app.addEventListener('submit',x=>{if(x.target.id!=='of')return;x.preventDefault();let d=new FormData(x.target);S.offers.push({id:'o'+Date.now(),...Object.fromEntries(d.entries())});save();render()});
render();load();
})();
</script></body></html>
