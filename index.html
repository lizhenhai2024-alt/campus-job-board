ground:var(--redbg);border-color:#ffd0cc;color:var(--red)}.match{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;text-align:right}.level{font-size:25px;font-weight:850}.level small{font-size:12px;color:var(--muted);font-weight:500}.matchreason{color:var(--muted);font-size:12px;margin:4px 0 10px;max-width:210px}.summary{display:flex;justify-content:space-between;align-items:center;margin:12px 2px 8px}.empty{padding:30px;text-align:center;color:var(--muted)}.sectiontitle{margin:24px 0 10px}.sectiontitle h2{margin:0 0 3px;font-size:19px}.sectiontitle p{margin:0;color:var(--muted)}.pipeline{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}.lane{background:#eef0f5;border-radius:11px;padding:9px;min-height:180px}.lane h3{margin:0 0 8px;font-size:13px}.mini{background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px;margin-bottom:7px;cursor:pointer}.mini b{display:block}.mini small{color:var(--muted)}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 12px;flex-wrap:wrap}.toolbar .actions{gap:7px}.charts{display:grid;grid-template-columns:1fr 1fr;gap:12px}.chart{padding:16px}.chart h3{margin-top:0}.bar{display:grid;grid-template-columns:120px 1fr 42px;align-items:center;gap:8px;margin:9px 0}.barbg{height:8px;background:#edf0f5;border-radius:999px;overflow:hidden}.barfill{height:100%;background:var(--blue)}.offers{display:grid;grid-template-columns:330px 1fr;gap:12px}.offer{padding:16px}.offer .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.offer .wide{grid-column:1/-1}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.help{margin-top:22px;padding:16px}.help h3{margin:0 0 8px}.help ul{margin:6px 0 0;padding-left:20px;color:var(--muted)}.modalbg{position:fixed;inset:0;background:rgba(16,24,40,.48);display:grid;place-items:center;padding:18px;z-index:30}.modal{background:#fff;width:min(760px,100%);max-height:88vh;overflow:auto;border-radius:15px;padding:18px}.close{float:right;width:34px;height:34px;border:0;border-radius:8px;background:#f2f4f7;font-size:20px;cursor:pointer}.detailgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.detailbox{background:#f8f9fb;border:1px solid var(--line);border-radius:9px;padding:10px}.detailbox b{display:block}.muted{color:var(--muted)}.hidden{display:none!important}@media(max-width:1050px){.stats{grid-template-columns:repeat(3,1fr)}.filters{grid-template-columns:repeat(3,1fr)}.pipeline{grid-template-columns:repeat(3,1fr)}}@media(max-width:760px){.page{padding:0 12px 30px}.topbar{margin:0 -12px;padding:12px}.toprow,.hero{flex-direction:column;align-items:stretch}.hero h1{font-size:24px}.stats{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr 1fr}.job{grid-template-columns:1fr}.match{align-items:flex-start;text-align:left}.pipeline{grid-template-columns:1fr}.charts,.offers{grid-template-columns:1fr}.offer .grid{grid-template-columns:1fr}.offer .wide{grid-column:auto}.detailgrid{grid-template-columns:1fr}}

<script>
(()=>{'use strict';
const DATA_URLS=['https://raw.githubusercontent.com/lizhenhai2024-alt/AI_Job/main/src/data/live-jobs.js','https://cdn.jsdelivr.net/gh/lizhenhai2024-alt/AI_Job@main/src/data/live-jobs.js'];
const STORAGE='campus-job-board:original-restored';
const STAGES=['已收藏','已投递','笔试','面试','Offer','淘汰'];
const TARGET_DIRECTIONS=[
 ['GTM·市场策略',/\bGTM\b|go[- ]?to[- ]?market|市场策略|产品营销|产品市场|品牌策略|品牌营销|全球营销/i],
 ['PMO·项目管理',/PMO|项目管理|项目运营|项目推进|项目协调|项目助理/i],
 ['跨境电商运营',/跨境电商|电商运营|Amazon|TikTok\s*Shop|Shopee|独立站|DTC|平台运营|店铺运营/i],
 ['外贸·海外业务',/海外业务|国际业务|国际商务|海外商务|国际贸易|贸易运营|海外市场|海外运营/i],
 ['HR·HRBP',/HRBP|人力资源|招聘运营|校园招聘|雇主品牌|人才发展/i],
 ['国际物流·供应链管培',/国际物流|物流运营|供应链|采购管理|供应链管培|物流管培/i],
 ['品牌·内容·用户运营',/品牌运营|内容运营|社媒|KOL|SEO|新媒体|用户运营|用户增长|社区运营/i],
 ['经营·商业分析',/经营分析|商业分析|战略运营|业务运营|经营管理/i],
 ['其他',/.*/i]
];
const CITY_SCORE={深圳:1,广州:.9,上海:.9,武汉:.75,长沙:.75,北京:.72,杭州:.72,苏州:.68};
const EXPERIENCE_STRONG=/海外业务|国际业务|竞品分析|市场研究|本地化|翻译|跨文化|双语|展会|Gate评审|项目节点|海外客户|英文资料/i;
const EXPERIENCE_WEAK=/项目|市场|客户|运营|流程|协同|沟通|数据|品牌|供应链|物流|活动|交付/i;
const INDUSTRY_GOOD=/消费电子|跨境电商|全球化|出海|国际业务|海外市场|DTC|品牌|电商/i;
const GROWTH_BAD=/纯翻译|翻译专员|行政|文员|跟单|客服专员|低价值支持|纯销售|销售代表|渠道销售|区域销售/i;
const TECH_BAD=/研发工程师|算法工程师|软件工程师|硬件工程师|机械工程师|电气工程师|结构工程师|测试工程师|实施工程师/i;
const LANGUAGE_HARD=/日语N[12]|日语.*必须|必须.*日语|西班牙语.*必须|必须.*西班牙语|西语.*必须|必须.*西语|德语.*必须|必须.*德语|法语.*必须|必须.*法语|韩语.*必须|必须.*韩语/i;
const DEGREE_HARD=/研究生及以上|硕士及以上|仅限硕士|硕士学历/i;
const STEM_HARD=/必须.*理工|仅限.*理工|理工科.*必须|计算机.*必须|技术专业.*必须/i;
const fb=[{id:'fallback-1',company:'示例公司',title:'海外业务运营（2027届）',city:'深圳',graduationYear:'2027',roleFamily:['海外运营'],languages:['英语'],experienceKeywords:['海外','市场','客户','运营'],preferenceTags:['国际业务','出海'],source:'回退示例',sourceType:'secondary',deadline:'2026-12-31',description:'实时岗位池暂不可用时的示例记录。',candidateFit:{major:{verdict:'兼容',label:'文科/社科专业范围兼容',evidence:['英语/国际商务等相关专业']},responsibility:{verdict:'偏语言/商务'},warnings:[],hardRequirements:[]}}];
let persisted={};try{persisted=JSON.parse(localStorage.getItem(STORAGE)||localStorage.getItem('campus-job-board:v3')||localStorage.getItem('campus-job-board:v2')||'{}')}catch{}
const S={tab:'jobs',jobs:[],mode:'loading',updated:'',meta:{},filter:{q:'',level:'全部',direction:'全部',city:'全部',source:'全部'},status:persisted.status||{},offers:persisted.offers||[],selected:null,limit:40};
const app=document.getElementById('app');
const esc=(v='')=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uniq=a=>[...new Set(a.filter(Boolean))];
const save=()=>localStorage.setItem(STORAGE,JSON.stringify({status:S.status,offers:S.offers}));
function text(job){const f=job.candidateFit||{};return [job.title,job.description,job.city,...(job.roleFamily||[]),...(job.skills||[]),...(job.languages||[]),...(job.experienceKeywords||[]),...(job.preferenceTags||[]),...(job.riskTags||[]),...(f.major?.evidence||[]),...(f.eligibilityEvidence||[]),...(f.warnings||[]),...(f.strengths||[])].filter(Boolean).join(' ')}
function direction(job){const t=[job.title,...(job.roleFamily||[])].join(' ');for(const [name,rx] of TARGET_DIRECTIONS){if(rx.test(t))return name}return'其他'}
function gate(job){const f=job.candidateFit||{},t=text(job),reasons=[];if(String(job.graduationYear||'')&&String(job.graduationYear)!=='2027')reasons.push('非2027届');if(/实习|intern(ship)?/i.test(job.title||''))reasons.push('实习岗位');if(DEGREE_HARD.test(t)&&!/本科及以上|本科或硕士|本科、硕士|本科\/硕士/.test(t))reasons.push('学历门槛不匹配');if(STEM_HARD.test(t)||/硬门槛/.test(String(f.major?.verdict||'')))reasons.push('专业硬门槛不匹配');if((f.hardRequirements||[]).some(x=>/技术|证书|专业/.test(String(x))))reasons.push('存在硬能力/资格门槛');if(LANGUAGE_HARD.test(t))reasons.push('必须小语种，英语画像不满足');if(TECH_BAD.test(job.title||''))reasons.push('无关技术岗位');return{ok:reasons.length===0,reasons}}
function score(job){const f=job.candidateFit||{},t=text(job),dir=direction(job),g=gate(job);let duty=.48;const dv=String(f.responsibility?.verdict||'');if(/语言.*商务主导|商务.*主导/.test(dv))duty=.96;else if(/偏语言|偏商务/.test(dv))duty=.86;else if(/混合/.test(dv))duty=.62;else if(/偏技术/.test(dv))duty=.3;else if(/技术主导/.test(dv))duty=.08;const dirWeight=dir==='GTM·市场策略'?1:dir==='跨境电商运营'?.97:dir==='外贸·海外业务'?.94:dir==='PMO·项目管理'?.9:dir==='品牌·内容·用户运营'?.86:dir==='国际物流·供应链管培'?.78:dir==='经营·商业分析'?.76:dir==='HR·HRBP'?.68:.48;const responsibility=Math.round(30*(dirWeight*.58+duty*.42));
 const kws=job.experienceKeywords||[],strong=kws.filter(x=>EXPERIENCE_STRONG.test(x)).length,weak=kws.filter(x=>EXPERIENCE_WEAK.test(x)).length;let ev=.38;if(strong>=3)ev=1;else if(strong===2)ev=.88;else if(strong===1&&weak>=2)ev=.76;else if(strong===1)ev=.62;else if(weak>=3)ev=.55;const evidence=Math.round(25*ev);
 let intl=.42;if(/英语|英文|English|CET|海外|国际|全球|跨境|出海|GTM|跨文化/.test(t))intl=.92;if(/英语.*工作语言|英文.*工作语言|海外客户|英文沟通|跨文化/.test(t))intl=1;const english=Math.round(15*intl);
 let city=.52;for(const [c,w]of Object.entries(CITY_SCORE))if(String(job.city||'').includes(c)){city=w;break}const cityScore=Math.round(10*city);
 let industry=.55;if(INDUSTRY_GOOD.test(t))industry=.9;if(/消费电子|全球化品牌|跨境电商|DTC/.test(t))industry=1;const industryScore=Math.round(10*industry);
 let growth=.65;if(GROWTH_BAD.test(job.title||''))growth=.18;if(/管培|轮岗|培养|成长|GTM|产品营销|项目管理|商业分析/.test(t))growth=.9;if(/SQL|Python|编程/.test(t)&&!/优先|加分/.test(t))growth=Math.min(growth,.48);const growthScore=Math.round(10*growth);
 let total=responsibility+evidence+english+cityScore+industryScore+growthScore;const risks=[];if(/高压|抗压|节奏快/.test(t))risks.push('工作节奏/压力需核验');if(/长期驻外|长期海外|频繁出差|高频出差/.test(t))risks.push('驻外/出差强度需核验');if(/纯销售KPI|销售指标|销售业绩/.test(t))risks.push('销售KPI需核验');if(!g.ok)total=Math.min(total,49);return{score:Math.max(0,Math.min(100,total)),parts:{responsibility,evidence,english,city:cityScore,industry:industryScore,growth:growthScore},gate:g,risks,dir}}
function level(result){if(!result.gate.ok)return'C';if(result.score>=80)return'S';if(result.score>=65)return'A';if(result.score>=50)return'B';return'C'}
function active(job){if(!job.deadline)return true;const d=new Date(job.deadline+'T23:59:59+08:00');return Number.isNaN(d.getTime())||d>=new Date()}
function base(){return S.jobs.filter(j=>String(j.graduationYear||'2027').includes('2027')&&active(j)).map(j=>{const r=score(j);return{...j,_r:r,_score:r.score,_level:level(r),_direction:r.dir}}).sort((a,b)=>{const lr={S:4,A:3,B:2,C:1};return lr[b._level]-lr[a._level]||b._score-a._score||(b.sourceType==='official'?1:0)-(a.sourceType==='official'?1:0)||String(b.publishedAt||'').localeCompare(String(a.publishedAt||''))})}
function filtered(){const f=S.filter,q=f.q.trim().toLowerCase();return base().filter(j=>{const hay=[j.company,j.title,j.city,j._direction,...(j.skills||[])].join(' ').toLowerCase();const source=j.sourceType==='official'?'官方':'二手';return(!q||hay.includes(q))&&(f.level==='全部'||j._level===f.level)&&(f.direction==='全部'||j._direction===f.direction)&&(f.city==='全部'||j.city===f.city)&&(f.source==='全部'||source===f.source)})}
function updateBox(){return`<div class="update"><b><span class="dot ${S.mode==='live'?'':'warn'}"></span>${S.mode==='live'?'数据已更新':S.mode==='loading'?'正在读取岗位池':'回退数据模式'}</b><small>调研更新 ${S.updated?new Date(S.updated).toLocaleString('zh-CN',{hour12:false}):'—'}</small></div>`}
function nav(){const count=Object.keys(S.status).length;return`<div class="topbar"><div class="toprow"><div class="brand">2027届校招机会看板 · 英语专业</div><div class="nav">${[['jobs','机会看板'],['pipeline',`我的投递 ${count}`],['stats','统计分析'],['offers','Offer 对比']].map(([k,n])=>`<button data-tab="${k}" class="${S.tab===k?'active':''}">${n}</button>`).join('')}</div></div></div>`}
function shell(body){return`<div class="page">${nav()}${body}</div>`}
function statsBoxes(items){return`<div class="stats">${items.map(([v,l])=>`<div class="stat"><strong>${v}</strong><span>${l}</span></div>`).join('')}</div>`}
function jobCard(j){const f=j.candidateFit||{},reason=j._level==='S'?'方向、英语场景与经历证据较强':j._level==='A'?'整体适配，存在少量待核项':j._level==='B'?'有可迁移点，建议选择性投递':'硬条件/综合价值不足';return`<article class="card job"><div><div class="company">${esc(j.company||'待核公司')}</div><div class="jobtitle">${esc(j.title||'待核岗位')}</div><div class="meta"><span>📍 ${esc(j.city||'待核')}</span><span>🧭 ${esc(j._direction)}</span><span>🗓 ${esc(j.deadline||'待核')}</span><span>${esc(j.source||'来源待核')}</span></div><div class="tags"><span class="tag ${j.sourceType==='official'?'ok':'warn'}">${j.sourceType==='official'?'官方来源':'二手来源 · 投递前回官网'}</span>${f.major?.label?`<span class="tag">${esc(f.major.label)}</span>`:''}${(f.warnings||[]).slice(0,2).map(x=>`<span class="tag warn">△ ${esc(x)}</span>`).join('')}${j._r.gate.reasons.slice(0,1).map(x=>`<span class="tag bad">× ${esc(x)}</span>`).join('')}</div></div><div class="match"><div><div class="level"><span class="pill ${j._level.toLowerCase()}">${j._level}级</span> <small>${j._score}/100</small></div><div class="matchreason">${reason}</div></div><div class="actions">${j.sourceUrl?`<a class="btn ${j.sourceType==='official'?'primary':'soft'}" target="_blank" rel="noopener" href="${esc(j.sourceUrl)}">${j.sourceType==='official'?'立即投递':'查看来源'}</a>`:''}<button class="btn" data-detail="${esc(j.id)}">评价详情</button><select class="status" data-status="${esc(j.id)}"><option value="">投递状态</option>${STAGES.map(x=>`<option ${S.status[j.id]===x?'selected':''}>${x}</option>`).join('')}</select></div></div></article>`}
function jobsPage(){const b=base(),f=filtered(),dirs=['全部',...uniq(b.map(x=>x._direction))],cities=['全部',...uniq(b.map(x=>x.city))];const deadline=new Date('2026-10-08T23:59:59+08:00'),soon=b.filter(j=>j.deadline&&new Date(j.deadline+'T23:59:59+08:00')<=deadline).length;return`<section class="hero"><div><h1>2027届校招机会看板</h1><div class="subtitle">湖南大学 · 英语专业 · CET-6 / TEM-4 ｜ 目标方向：GTM·市场策略 / PMO / 跨境电商运营 / 外贸海外业务 / HR·HRBP / 国际物流供应链管培</div></div>${updateBox()}</section>${statsBoxes([[b.length,'有效岗位总数'],[b.filter(x=>x._level==='S').length,'S级'],[b.filter(x=>x._level==='A').length,'A级'],[uniq(b.map(x=>x._direction)).length,'覆盖方向'],[uniq(b.map(x=>x.city)).length,'覆盖目标城市'],[soon,'10-08前截止']])}${S.mode==='fallback'?'<div class="notice">实时数据源暂不可用，当前显示回退样例；刷新页面后会重新尝试连接 AI_Job 岗位池。</div>':''}<div class="card filters"><div class="field"><label>搜索</label><input id="q" value="${esc(S.filter.q)}" placeholder="公司 / 岗位 / 关键词"></div><div class="field"><label>匹配等级</label><select id="level">${['全部','S','A','B','C'].map(x=>`<option ${S.filter.level===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>方向</label><select id="direction">${dirs.map(x=>`<option ${S.filter.direction===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>城市</label><select id="city">${cities.map(x=>`<option ${S.filter.city===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>来源</label><select id="source">${['全部','官方','二手'].map(x=>`<option ${S.filter.source===x?'selected':''}>${x}</option>`).join('')}</select></div><button id="reset" class="btn">重置</button></div><div class="ruleline"><div class="legend"><span class="pill s">S 优先申请</span><span class="pill a">A 值得尝试</span><span class="pill b">B 探索机会</span><span class="pill c">C 默认低优先</span></div><span class="muted">先看硬条件，再看软匹配；分数仅用于排序，不代表录用概率</span></div><div class="summary"><b>共 ${f.length} 个符合筛选的岗位</b><span class="muted">按 S/A/B/C 与匹配度排序</span></div><div class="joblist">${f.slice(0,S.limit).map(jobCard).join('')||'<div class="card empty">没有符合当前筛选条件的岗位</div>'}</div>${f.length>S.limit?'<p style="text-align:center"><button class="btn" id="more">加载更多</button></p>':''}${dataNotes()}</section>`}
function dataNotes(){return`<div class="card help"><h3>数据说明</h3><ul><li>岗位信息来自 2026 年 9 月公开校招信息及企业招聘官网/API，AI_Job 负责持续发现、去重和更新；最终英语专业适配评价由本看板执行。</li><li>二手来源岗位必须回企业校招官网核验后再投递；“官方来源”仅表示岗位链接来自企业招聘官网或官方招聘系统。</li><li>公司风险、工作强度和薪资等信号若来自公开讨论或匿名经验，仅作“待核提示”，不作为事实结论。</li><li>岗位匹配分只用于申请顺序，不等于录用概率；硬条件未知时进入待确认，而不是自动淘汰。</li></ul></div>`}
function pipelinePage(){const b=base(),selected=b.filter(j=>S.status[j.id]);return`<section class="hero"><div><h1>我的投递</h1><div class="subtitle">投递数据自动保存在当前浏览器。可导出 JSON / CSV 备份，也可从 JSON 恢复。</div></div></section><div class="toolbar"><div class="actions"><button class="btn" id="export-json">导出 JSON</button><button class="btn" id="export-csv">导出 CSV</button><button class="btn" id="import-json">导入 JSON</button><input id="import-file" type="file" accept="application/json" class="hidden"></div><span class="muted">当前记录 ${selected.length} 个岗位</span></div><div class="pipeline">${STAGES.map(stage=>{const arr=selected.filter(j=>S.status[j.id]===stage);return`<div class="lane"><h3>${stage} · ${arr.length}</h3>${arr.map(j=>`<div class="mini" data-detail="${esc(j.id)}"><b>${esc(j.title)}</b><small>${esc(j.company)} · ${j._level}级</small></div>`).join('')||'<span class="muted">暂无</span>'}</div>`}).join('')}</div>${dataNotes()}`}
function bars(rows,max){const m=max||Math.max(1,...rows.map(x=>x[1]));return rows.map(([n,v])=>`<div class="bar"><span>${esc(n)}</span><div class="barbg"><div class="barfill" style="width:${Math.min(100,v/m*100)}%"></div></div><b>${v}</b></div>`).join('')}
function statsPage(){const b=base();const byDir=Object.entries(b.reduce((m,j)=>(m[j._direction]=(m[j._direction]||0)+1,m),{})).sort((a,b)=>b[1]-a[1]).slice(0,8),byCity=Object.entries(b.reduce((m,j)=>(m[j.city]=(m[j.city]||0)+1,m),{})).sort((a,b)=>b[1]-a[1]).slice(0,8);return`<section class="hero"><div><h1>统计分析</h1><div class="subtitle">查看岗位等级、方向、城市和来源结构。</div></div>${updateBox()}</section><div class="charts"><div class="card chart"><h3>匹配等级</h3>${bars(['S','A','B','C'].map(x=>[x+'级',b.filter(j=>j._level===x).length]))}</div><div class="card chart"><h3>岗位来源</h3>${bars([['官方来源',b.filter(j=>j.sourceType==='official').length],['二手来源',b.filter(j=>j.sourceType!=='official').length]])}</div><div class="card chart"><h3>方向分布</h3>${bars(byDir)}</div><div class="card chart"><h3>城市分布</h3>${bars(byCity)}</div></div>${dataNotes()}`}
function offerScore(o){return Math.round((Number(o.fit||0)*.3+Number(o.growth||0)*.25+Number(o.pay||0)*.2+Number(o.city||0)*.15+Number(o.pace||0)*.1)*10)/10}
function offersPage(){return`<section class="hero"><div><h1>Offer 对比</h1><div class="subtitle">匹配 30% · 成长 25% · 薪酬 20% · 城市 15% · 工作节奏 10%</div></div></section><div class="offers"><form id="offer-form" class="card offer"><div class="grid"><input class="wide" name="company" required placeholder="公司"><input class="wide" name="title" required placeholder="岗位"><input name="location" placeholder="城市"><input name="salary" placeholder="薪资/总包"><div><label>岗位匹配 1–10</label><input name="fit" type="number" min="1" max="10" value="7"></div><div><label>成长空间 1–10</label><input name="growth" type="number" min="1" max="10" value="7"></div><div><label>薪酬福利 1–10</label><input name="pay" type="number" min="1" max="10" value="7"></div><div><label>城市偏好 1–10</label><input name="city" type="number" min="1" max="10" value="7"></div><div><label>工作节奏 1–10</label><input name="pace" type="number" min="1" max="10" value="7"></div><textarea class="wide" name="note" placeholder="备注：团队、业务、风险、发展路径等"></textarea><button class="btn primary wide">加入对比</button></div></form><div class="card offer table"><table><thead><tr><th>公司 / 岗位</th><th>城市</th><th>薪资</th><th>综合</th><th>备注</th><th></th></tr></thead><tbody>${S.offers.length?[...S.offers].sort((a,b)=>offerScore(b)-offerScore(a)).map(o=>`<tr><td><b>${esc(o.company)}</b><br>${esc(o.title)}</td><td>${esc(o.location||'-')}</td><td>${esc(o.salary||'-')}</td><td><b>${offerScore(o)}</b></td><td>${esc(o.note||'-')}</td><td><button class="btn danger" data-delete-offer="${o.id}">删除</button></td></tr>`).join(''):'<tr><td colspan="6" class="muted">暂无 Offer 对比记录</td></tr>'}</tbody></table></div></div>`}
function modal(){if(!S.selected)return'';const j=base().find(x=>x.id===S.selected);if(!j)return'';const p=j._r.parts,f=j.candidateFit||{};return`<div class="modalbg" data-close="1"><div class="modal" onclick="event.stopPropagation()"><button class="close" data-close="1">×</button><div class="company">${esc(j.company)}</div><h2>${esc(j.title)}</h2><p><span class="pill ${j._level.toLowerCase()}">${j._level}级</span> <b>${j._score}/100</b> · ${esc(j._direction)}</p><div class="detailgrid"><div class="detailbox"><b>岗位方向与职责 ${p.responsibility}/30</b><span class="muted">岗位职责实质优先于岗位标题</span></div><div class="detailbox"><b>个人经历与能力 ${p.evidence}/25</b><span class="muted">仅使用已记录真实经历信号</span></div><div class="detailbox"><b>英语与国际业务 ${p.english}/15</b><span class="muted">英语工作场景、跨文化、海外业务</span></div><div class="detailbox"><b>城市与工作方式 ${p.city}/10</b><span class="muted">深圳优先，广州/上海次之</span></div><div class="detailbox"><b>行业与企业偏好 ${p.industry}/10</b><span class="muted">全球化品牌、跨境电商、国际业务</span></div><div class="detailbox"><b>成长与可补足性 ${p.growth}/10</b><span class="muted">岗位价值与能力缺口是否可补足</span></div></div><h3>硬条件 / 风险</h3><div class="tags">${j._r.gate.reasons.map(x=>`<span class="tag bad">× ${esc(x)}</span>`).join('')}${j._r.risks.map(x=>`<span class="tag warn">△ ${esc(x)}</span>`).join('')}${!j._r.gate.reasons.length&&!j._r.risks.length?'<span class="tag ok">未识别明显硬门槛</span>':''}</div>${f.major?.evidence?.length?`<h3>专业要求证据</h3><p class="muted">${esc(f.major.evidence.slice(0,2).join('；'))}</p>`:''}${j.sourceUrl?`<p><a class="btn primary" target="_blank" rel="noopener" href="${esc(j.sourceUrl)}">${j.sourceType==='official'?'打开官方职位':'查看来源并回官网核验'}</a></p>`:''}</div></div>`}
function render(){const body=S.tab==='jobs'?jobsPage():S.tab==='pipeline'?pipelinePage():S.tab==='stats'?statsPage():offersPage();app.innerHTML=shell(body)+modal()}
function parseModule(raw){const a=raw.indexOf('export const liveJobs ='),s=raw.indexOf('[',a),m=raw.indexOf('export const discoveryMeta',s),segment=raw.slice(s,m),end=segment.lastIndexOf('];');if(a<0||s<0||m<0||end<0)throw Error('岗位池格式异常');const jobs=JSON.parse(segment.slice(0,end+1));let meta={};const ms=raw.indexOf('{',m),me=raw.lastIndexOf('};');if(ms>0&&me>ms)try{meta=JSON.parse(raw.slice(ms,me+1))}catch{}return{jobs,meta}}
async function load(){for(const url of DATA_URLS){try{const c=new AbortController(),timer=setTimeout(()=>c.abort(),9000),r=await fetch(url,{cache:'no-store',signal:c.signal});clearTimeout(timer);if(!r.ok)throw Error(String(r.status));const {jobs,meta}=parseModule(await r.text());if(!jobs.length)throw Error('empty');S.jobs=jobs;S.meta=meta;S.updated=meta.updatedAt||jobs[0]?.discoveredAt||'';S.mode='live';render();return}catch(err){console.warn('[board data]',err)}}S.jobs=fb;S.mode='fallback';S.updated='';render()}
function download(name,text,type='application/json'){const a=document.createElement('a'),blob=new Blob([text],{type});a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
app.addEventListener('click',ev=>{const tab=ev.target.closest('[data-tab]')?.dataset.tab;if(tab){S.tab=tab;S.selected=null;render();return}const detail=ev.target.closest('[data-detail]')?.dataset.detail;if(detail){S.selected=detail;render();return}if(ev.target.closest('[data-close]')){S.selected=null;render();return}if(ev.target.id==='reset'){S.filter={q:'',level:'全部',direction:'全部',city:'全部',source:'全部'};render();return}if(ev.target.id==='more'){S.limit+=40;render();return}if(ev.target.id==='export-json'){download('campus-job-board-applications.json',JSON.stringify({status:S.status,offers:S.offers,exportedAt:new Date().toISOString()},null,2));return}if(ev.target.id==='export-csv'){const rows=[['岗位ID','公司','岗位','状态','等级','匹配分'],...base().filter(j=>S.status[j.id]).map(j=>[j.id,j.company,j.title,S.status[j.id],j._level,j._score])];const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n');download('campus-job-board-applications.csv',csv,'text/csv;charset=utf-8');return}if(ev.target.id==='import-json'){document.getElementById('import-file')?.click();return}const del=ev.target.closest('[data-delete-offer]')?.dataset.deleteOffer;if(del){S.offers=S.offers.filter(o=>o.id!==del);save();render()}});
app.addEventListener('input',ev=>{if(ev.target.id==='q'){S.filter.q=ev.target.value;const pos=ev.target.selectionStart;render();const q=document.getElementById('q');q?.focus();q?.setSelectionRange(pos,pos)}});
app.addEventListener('change',ev=>{if(['level','direction','city','source'].includes(ev.target.id)){S.filter[ev.target.id]=ev.target.value;render();return}const id=ev.target.dataset.status;if(id!==undefined){if(ev.target.value)S.status[id]=ev.target.value;else delete S.status[id];save();render();return}if(ev.target.id==='import-file'&&ev.target.files?.[0]){const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);S.status=data.status||{};S.offers=data.offers||[];save();render()}catch{alert('JSON 文件格式不正确')}};reader.readAsText(ev.target.files[0])}});
app.addEventListener('submit',ev=>{if(ev.target.id!=='offer-form')return;ev.preventDefault();const data=Object.fromEntries(new FormData(ev.target).entries());S.offers.push({id:'offer-'+Date.now(),...data});save();render()});
render();load();
})();
</script>
</body></html>
