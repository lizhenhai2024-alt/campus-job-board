<style>
:root{--blue:#3b5ccc;--blue2:#eef2ff;--bg:#f6f7fb;--card:#fff;--text:#1f2937;--muted:#667085;--line:#e5e7eb;--green:#14805e;--greenbg:#eefaf6;--amber:#9a6700;--amberbg:#fff8e8;--red:#b42318;--redbg:#fff1f0;--shadow:0 6px 24px rgba(32,42,76,.06)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}.page{max-width:1320px;margin:auto;padding:0 20px 42px}.topbar{position:sticky;top:0;z-index:10;margin:0 -20px;padding:14px 20px 10px;background:rgba(246,247,251,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.toprow{max-width:1320px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{font-weight:800;font-size:17px;white-space:nowrap}.nav{display:flex;gap:5px;overflow:auto}.nav button{border:0;background:transparent;border-radius:9px;padding:8px 12px;color:#475467;white-space:nowrap;cursor:pointer}.nav button.active{background:#fff;color:var(--blue);box-shadow:0 2px 12px rgba(40,55,110,.07)}.hero{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding:26px 0 18px}.hero h1{margin:0 0 7px;font-size:29px;line-height:1.2}.subtitle{color:var(--muted);max-width:900px}.update{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 13px;min-width:210px;box-shadow:var(--shadow)}.update b{display:block}.update small{display:block;color:var(--muted);margin-top:2px}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--green);margin-right:6px}.dot.warn{background:#d89b20}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px 16px;box-shadow:var(--shadow)}.stat strong{display:block;font-size:25px;line-height:1.2;margin-bottom:4px}.stat span{font-size:12px;color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow)}.filters{display:grid;grid-template-columns:2fr repeat(5,1fr) auto;gap:9px;padding:12px;margin:14px 0}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}.field input,.field select,.status,.offer input,.offer textarea{width:100%;border:1px solid #d7dce5;background:#fff;border-radius:8px;padding:9px 10px;color:var(--text)}.btn{border:1px solid #d4d9e3;background:#fff;color:#344054;border-radius:8px;padding:8px 11px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:5px}.btn:hover{border-color:#aeb8cf}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.soft{background:var(--blue2);border-color:#dce4ff;color:#3550a9}.btn.danger{color:var(--red)}.ruleline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:3px 2px 10px}.legend{display:flex;gap:7px;flex-wrap:wrap}.pill,.tag{display:inline-flex;align-items:center;border-radius:999px;padding:3px 8px;font-size:12px;background:#f5f7fa;border:1px solid #e6e9ef;color:#475467}.pill.s{background:#eef6ff;border-color:#d5e5ff;color:#2459aa}.pill.a{background:#eefaf6;border-color:#cdeee0;color:#147456}.pill.b{background:#fff8e8;border-color:#f1dfb5;color:#8a5b00}.pill.c{background:#f6f6f7;color:#667085}.notice{padding:10px 12px;border-radius:10px;margin:10px 0;background:var(--amberbg);border:1px solid #f2deb2;color:#7c5510}.joblist{display:grid;gap:10px}.job{padding:17px 18px;display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:18px}.company{font-weight:700;color:#536174}.jobtitle{font-size:19px;font-weight:800;margin:2px 0 7px}.meta,.tags,.actions{display:flex;gap:7px;flex-wrap:wrap}.meta{font-size:12px;color:var(--muted)}.tags{margin-top:9px}.tag{border-radius:7px}.tag.ok{background:var(--greenbg);border-color:#caebdf;color:var(--green)}.tag.warn{background:var(--amberbg);border-color:#efdcaf;color:var(--amber)}.tag.bad{background:var(--redbg);border-color:#ffd0cc;color:var(--red)}.match{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;text-align:right}.level{font-size:25px;font-weight:850}.level small{font-size:12px;color:var(--muted);font-weight:500}.matchreason{color:var(--muted);font-size:12px;margin:4px 0 10px;max-width:230px}.summary{display:flex;justify-content:space-between;align-items:center;margin:12px 2px 8px}.empty{padding:30px;text-align:center;color:var(--muted)}.pipeline{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}.lane{background:#eef0f5;border-radius:11px;padding:9px;min-height:180px}.lane h3{margin:0 0 8px;font-size:13px}.mini{background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px;margin-bottom:7px;cursor:pointer}.mini b{display:block}.mini small{color:var(--muted)}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 12px;flex-wrap:wrap}.toolbar .actions{gap:7px}.charts{display:grid;grid-template-columns:1fr 1fr;gap:12px}.chart{padding:16px}.chart h3{margin-top:0}.bar{display:grid;grid-template-columns:120px 1fr 42px;align-items:center;gap:8px;margin:9px 0}.barbg{height:8px;background:#edf0f5;border-radius:999px;overflow:hidden}.barfill{height:100%;background:var(--blue)}.offers{display:grid;grid-template-columns:330px 1fr;gap:12px}.offer{padding:16px}.offer .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.offer .wide{grid-column:1/-1}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.help{margin-top:22px;padding:16px}.help h3{margin:0 0 8px}.help ul{margin:6px 0 0;padding-left:20px;color:var(--muted)}.modalbg{position:fixed;inset:0;background:rgba(16,24,40,.48);display:grid;place-items:center;padding:18px;z-index:30}.modal{background:#fff;width:min(780px,100%);max-height:88vh;overflow:auto;border-radius:15px;padding:18px}.close{float:right;width:34px;height:34px;border:0;border-radius:8px;background:#f2f4f7;font-size:20px;cursor:pointer}.detailgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.detailbox{background:#f8f9fb;border:1px solid var(--line);border-radius:9px;padding:10px}.detailbox b{display:block}.muted{color:var(--muted)}.hidden{display:none!important}@media(max-width:1120px){.stats{grid-template-columns:repeat(3,1fr)}.filters{grid-template-columns:repeat(3,1fr)}.pipeline{grid-template-columns:repeat(3,1fr)}}@media(max-width:760px){.page{padding:0 12px 30px}.topbar{margin:0 -12px;padding:12px}.toprow,.hero{flex-direction:column;align-items:stretch}.hero h1{font-size:24px}.stats{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr 1fr}.job{grid-template-columns:1fr}.match{align-items:flex-start;text-align:left}.pipeline{grid-template-columns:1fr}.charts,.offers{grid-template-columns:1fr}.offer .grid{grid-template-columns:1fr}.offer .wide{grid-column:auto}.detailgrid{grid-template-columns:1fr}.ruleline,.summary{align-items:flex-start;flex-direction:column}}
