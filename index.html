(()=>{'use strict';const URLS=['https://raw.githubusercontent.com/lizhenhai2024-alt/AI_Job/main/src/data/live-jobs.js','https://cdn.jsdelivr.net/gh/lizhenhai2024-alt/AI_Job@main/src/data/live-jobs.js'],KEY='campus-job-board:v2',P=['已收藏','已投递','笔试','面试','Offer','淘汰'];const fb=[{id:'fb1',company:'信也科技',title:'2027届校招-商务管培生（派驻非洲）',roleFamily:['国际业务'],city:'深圳',graduationYear:'2027',skills:['英语','数据分析','电商'],preferenceTags:['国际业务','跨文化','出海','文科/社科专业范围兼容'],source:'回退示例',sourceType:'secondary',sourceUrl:'https://www.nowcoder.com/jobs/detail/465377?urlSource=sitemap',deadline:'2026-12-31',description:'实时岗位源暂不可用时的回退示例。',candidateFit:{major:{verdict:'兼容'},responsibility:{verdict:'偏语言/商务'},strengths:['文科/社科专业范围兼容','职责：国际业务'],warnings:[],bonus:4,penalty:0}},{id:'fb2',company:'昆仑万维',title:'【校招岗】市场运营',roleFamily:['市场/运营'],city:'北京',graduationYear:'2027',skills:['英语','数据分析'],preferenceTags:['国际业务','跨文化','出海'],source:'回退示例',sourceType:'secondary',sourceUrl:'https://www.nowcoder.com/jobs/detail/464798?urlSource=sitemap',deadline:'2028-09-01',description:'实时岗位源暂不可用时的回退示例。',candidateFit:{major:{verdict:'混合'},responsibility:{verdict:'语言/商务主导'},strengths:['职责：国际业务'],warnings:['需核对专业优先级'],bonus:4,penalty:5}}];let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{}const S={tab:'jobs',jobs:[],mode:'loading',msg:'正在加载自动岗位池…',updated:'',f:{q:'',city:'全部',role:'全部',tier:'全部',source:'全部'},n:30,status:saved.status||{},offers:saved.offers||[],sel:null},app=document.getElementById('app');const esc=(v='')=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uniq=a=>[...new Set(a.filter(Boolean))],clamp=n=>Math.max(0,Math.min(100,n)),save=()=>localStorage.setItem(KEY,JSON.stringify({status:S.status,offers:S.offers}));
function score(j){let n=52,f=j.candidateFit||{},m=f.major?.verdict||'',r=f.responsibility?.verdict||'';n+=m.includes('兼容')?20:m.includes('混合')?10:m.includes('不')?-18:4;if(/语言|商务|运营|市场|国际/.test(r))n+=12;if(/技术主导|研发|工程/.test(r))n-=18;n+=Math.min(14,(f.strengths||[]).length*4)-Math.min(18,(f.warnings||[]).length*5)+Number(f.bonus||0)-Number(f.penalty||0);let x=[...(j.skills||[]),...(j.languages||[])].join(' ');if(x.includes('英语'))n+=5;if(/电商|数据分析/.test(x))n+=3;if(/国际业务|出海|跨文化|海外/.test((j.preferenceTags||[]).join(' ')))n+=5;return clamp(Math.round(n))}const tier=n=>n>=85?'S':n>=72?'A':n>=60?'B':'C';function active(d){if(!d)return true;let x=new Date(d+'T23:59:59+08:00');return isNaN(x)||x>=new Date()}function base(){return S.jobs.filter(j=>String(j.graduationYear||'').includes('2027')&&active(j.deadline)).map(j=>({...j,_s:score(j),_t:tier(score(j))})).sort((a,b)=>b._s-a._s)}function list(){let f=S.f,k=f.q.toLowerCase().trim();return base().filter(j=>{let text=[j.company,j.title,j.city,...(j.roleFamily||[]),...(j.skills||[])].join(' ').toLowerCase(),src=j.sourceType==='official'?'官方':'二手';return(!k||text.includes(k))&&(f.city==='全部'||j.city===f.city)&&(f.role==='全部'||(j.roleFamily||[]).includes(f.role))&&(f.tier==='全部'||j._t===f.tier)&&(f.source==='全部'||src===f.source)})}function sync(){return `<div class="sync"><strong><span class="dot ${S.mode==='live'?'':'bad'}"></span>${S.mode==='live'?'自动岗位池已连接':S.mode==='loading'?'正在同步':'已启用回退数据'}</strong><small>${esc(S.msg)}</small>${S.updated?`<small>更新：${esc(new Date(S.updated).toLocaleString('zh-CN',{hour12:false}))}</small>`:''}</div>`}function shell(c){return `<div class="wrap"><header class="top"><div class="row"><div class="brand">2027届校招机会看板<div class="sub">英语专业 · 国际业务 / GTM / 运营 / 品牌 / 海外电商</div></div><nav class="nav">${[['jobs','机会看板'],['pipe','我的投递'],['stats','统计分析'],['offers','Offer 对比']].map(x=>`<button data-tab="${x[0]}" class="${S.tab===x[0]?'on':''}">${x[1]}</button>`).join('')}</nav></div></header><main>${c}</main function job(j){let f=j.candidateFit||{};return `<article class="card job"><div><div class="company">${esc(j.company)}</div><div class="title">${esc(j.title)}</div><div class="meta"><span>📍 ${esc(j.city||'待核')}</span><span>🎓 2027届</span><span>🗓 ${esc(j.deadline||'待核')}</span><span>${esc(j.source||'来源待核')}</span></div><div class="tags" style="margin-top:9px">${(j.roleFamily||[]).slice(0,3).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}<span class="tag ${j.sourceType==='official'?'ok':'warn'}">${j.sourceType==='official'?'官方来源':'二手来源'}</span></div><div class="tags" style="margin-top:8px">${(f.strengths||[]).slice(0,2).map(x=>`<span class="tag ok">✓ ${esc(x)}</span>`).join('')}${(f.warnings||[]).slice(0,1).map(x=>`<span class="tag warn">△ ${esc(x)}</span>`).join('')}</div></div><div class="score"><div><strong>${j._s}</strong><small>/100 · ${j._t}档</small></div><div class="acts">${j.sourceUrl?`<a class="btn" target="_blank" rel="noopener" href="${esc(j.sourceUrl)}">查看来源</a>`:''}<button class="btn" data-detail="${esc(j.id)}">匹配分析</button><select class="status" data-status="${esc(j.id)}"><option value="">加入投递</option>${P.map(x=>`<option ${S.status[j.id]===x?'selected':''}>${x}</option>`).join('')}</select></div></div></article>`}
function jobs(){let b=base(),l=list(),st={total:b.length,s:b.filter(x=>x._t==='S').length,a:b.filter(x=>x._t==='A').length,co:uniq(b.map(x=>x.company)).length,ci:uniq(b.map(x=>x.city)).length},cities=['全部',...uniq(b.map(x=>x.city))],roles=['全部',...uniq(b.flatMap(x=>x.roleFamily||[]))];return `<section class="hero"><div><h1>今天哪些岗位值得投？</h1><p class="muted">按英语专业适配度排序；S/A 优先，二手来源投递前回官网复核。</p></div>${sync()}</section>${S.mode==='fallback'?'<div class="notice">实时岗位池暂不可用，当前为回退数据；恢复网络后刷新即可重新同步。</div>':''}<section class="stats">${[['有效岗位',st.total],['S档',st.s],['A档',st.a],['公司',st.co],['城市',st.ci]].map(x=>`<div class="card stat"><div class="n">${x[1]}</div><div class="lab">${x[0]}</div></div>`).join('')}</section><div class="chips"><span class="chip">英语专业</span><span class="chip">国际业务</span><span class="chip">GTM / 产品营销</span><span class="chip">海外运营 / 电商</span><span class="chip">品牌 / 商业分析</span></div><section class="card tools"><div><label>关键词</label><input id="q" value="${esc(S.f.q)}" placeholder="公司 / 岗位 / 技能"></div><div><label>城市</label><select id="city">${cities.map(x=>`<option ${S.f.city===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div><label>岗位族</label><select id="role">${roles.map(x=>`<option ${S.f.role===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div><label>匹配档</label><select id="tier">${['全部','S','A','B','C'].map(x=>`<option ${S.f.tier===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>来源</label><select id="source">${['全部','官方','二手'].map(x=>`<option ${S.f.source===x?'selected':''}>${x}</option>`).join('')}</select></div><button class="btn" id="reset">重置</button></section><div class="result"><strong>${l.length} 个岗位</strong><span class="muted">按匹配度排序</span></div><section class="jobs">${l.length?l.slice(0,S.n).map(job).join(''):'<div class="card empty">没有符合条件的岗位</div>'}</section>${l.length>S.n?'<p style="text-align:center"><button class="btn" id="more">加载更多</button></p>':''}`}
function pipe(){let b=base().filter(x=>S.status[x.id]);return `<section class="hero"><div><h1>我的投递</h1><p class="muted">状态保存在当前浏览器。</p></div><div class="sync"><strong>${b.length} 个跟进岗位</strong><small>不会上传个人投递记录</small></div></section><section class="lanes">${P.map(p=>{let a=b.filter(x=>S.status[x.id]===p);return `<div class="lane"><h3><span>${p}</span><span>${a.length}</span></h3>${a.map(x=>`<div class="mini" data-detail="${x.id}"><strong>${esc(x.title)}</strong><div class="muted">${esc(x.company)} · ${esc(x.city||'')}</div></div>`).join('')||'<span class="muted">暂无</span>'}</div>`}).join('')}</section>`}function count(items,get,n=8){let m=new Map;items.forEach(x=>(Array.isArray(get(x))?get(x):[get(x)]).filter(Boolean).forEach(v=>m.set(v,(m.get(v)||0)+1)));return[...m].sort((a,b)=>b[1]-a[1]).slice(0,n)}function bars(a){let mx=Math.max(1,...a.map(x=>x[1]));return a.map(x=>`<div class="bar"><span>${esc(x[0])}</span><div class="bg"><div class="fill" style="width:${x[1]/mx*100}%"></div></div><b>${x[1]}</b></div>`).join('')}function stats(){let b=base();return `<section class="hero"><div><h1>统计分析</h1><p class="muted">检查岗位池结构，而不是只看岗位数量。</p></div>${sync()}</section><section class="charts"><div class="card chart"><h3>匹配等级</h3>${bars(['S','A','B','C'].map(t=>[t+'档',b.filter(x=>x._t===t).length]))}</div><div class="card chart"><h3>来源结构</h3>${bars([['官方',b.filter(x=>x.sourceType==='official').length],['二手',b.filter(x=>x.sourceType!=='official').length]])}</div><div class="card chart"><h3>城市分布</h3>${bars(count(b,x=>x.city))}</div><div class="card chart"><h3>岗位方向</h3>${bars(count(b,x=>x.roleFamily||[]))}</div></section>`}function os(o){return Math.round((+o.fit*.3 + +o.growth*.25 + +o.comp*.2 + +o.cityScore*.15 + +o.pace*.1)*10)/10}function offers(){return `<section class="hero"><div><h1>Offer 对比</h1><p class="muted">匹配30% · 成长25% · 薪酬20% · 城市15% · 节奏10%</p></div><div class="sync"><strong>${S.offers.length} 个 Offer / 意向</strong></div></section><section class="offers"><form id="o 暂无明显风险</span>'}</div>${j.sourceUrl?`<p><a class="btn primary" target="_blank" rel="noopener" href="${esc(j.sourceUrl)}">打开岗位来源</a></p>`:''}</div></div>`}function render(){app.innerHTML=shell(S.tab==='jobs'?jobs():S.tab==='pipe'?pipe():S.tab==='stats'?stats():offers())}
function parse(t){let s=t.indexOf('export const liveJobs ='),a=t.indexOf('[',s),m=t.indexOf('export const discoveryMeta',a),x=t.slice(a,m),e=x.lastIndexOf('];');if(s<0||a<0||m<0||e<0)throw Error('岗位数据格式异常');let arr=JSON.parse(x.slice(0,e+1)),meta={};let ms=t.indexOf('{',m),me=t.lastIndexOf('};');if(ms>0&&me>ms)try{meta=JSON.parse(t.slice(ms,me+1))}catch{}return{arr,meta}}async function load(){for(let u of URLS)try{let c=new AbortController,t=setTimeout(()=>c.abort(),8000),r=await fetch(u,{cache:'no-store',signal:c.signal});clearTimeout(t);if(!r.ok)throw Error(r.status);let {arr,meta}=parse(await r.text());if(!arr.length)throw Error('empty');S.jobs=arr;S.updated=meta.updatedAt||arr[0]?.discoveredAt||'';S.mode='live';S.msg=`已读取 ${arr.length} 条自动发现岗位，当前只展示仍有效的 2027 届机会。`;render();return}catch(e){console.warn(e)}S.jobs=fb;S.mode='fallback';S.msg='实时岗位源不可用，已切换到回退数据。';render()}
app.addEventListener('click',e=>{let t=e.target.closest('[data-tab]')?.dataset.tab;if(t){S.tab=t;S.sel=null;render();return}let d=e.target.closest('[data-detail]')?.dataset.detail;if(d){S.sel=d;render();return}if(e.target.closest('[data-close]')){S.sel=null;render();return}if(e.target.id==='reset'){S.f={q:'',city:'全部',role:'全部',tier:'全部',source:'全部'};S.n=30;render();return}if(e.target.id==='more'){S.n+=30;render();return}let del=e.target.closest('[data-del]')?.dataset.del;if(del){S.offers=S.offers.filter(x=>x.id!==del);save();render()}});app.addEventListener('input',e=>{if(e.target.id==='q'){S.f.q=e.target.value;let p=e.target.selectionStart;render();let x=document.getElementById('q');x?.focus();x?.setSelectionRange(p,p)}});app.addEventListener('change',e=>{if(['city','role','tier','source'].includes(e.target.id)){S.f[e.target.id]=e.target.value;render();return}let id=e.target.dataset.status;if(id!==undefined){e.target.value?S.status[id]=e.target.value:delete S.status[id];save();render()}});app.addEventListener('submit',e=>{if(e.target.id!=='of')return;e.preventDefault();let d=new FormData(e.target);S.offers.push({id:'o'+Date.now(),company:d.get('company'),title:d.get('title'),location:d.get('location'),salary:d.get('salary'),fit:d.get('fit'),growth:d.get('growth'),comp:d.get('comp'),cityScore:d.get('cityScore'),pace:d.get('pace'),note:d.get('note')});save();render()});render();load()})();
