name: Check campus job board

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'app-core.js'
      - 'app-loader.test.cjs'
      - 'api/jobs.js'
      - 'api/jobs.test.cjs'
      - 'api/state.js'
      - 'data/**'
      - 'vercel.json'
      - 'scoring.js'
      - 'logic-correctness.js'
      - 'company-hc-salary.js'
      - 'career-fit.js'
      - 'career-personalization.js'
      - 'career-fit.test.js'
      - 'career-personalization.test.js'
      - 'audit-intelligence-v1.3.cjs'
      - 'audit-regression.cjs'
      - 'scoring-v1.1.test.js'
      - 'scoring-v1.2.test.js'
      - 'scoring-v1.3-quality.test.js'
      - 'scoring-v1.4-industry.test.js'
      - 'calibrate-v1.1.js'
      - 'calibrate-v1.2.js'
      - '.github/workflows/board-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'app-core.js'
      - 'app-loader.test.cjs'
      - 'api/jobs.js'
      - 'api/jobs.test.cjs'
      - 'api/state.js'
      - 'data/**'
      - 'vercel.json'
      - 'scoring.js'
      - 'logic-correctness.js'
      - 'company-hc-salary.js'
      - 'career-fit.js'
      - 'career-personalization.js'
      - 'career-fit.test.js'
      - 'career-personalization.test.js'
      - 'audit-intelligence-v1.3.cjs'
      - 'audit-regression.cjs'
      - 'scoring-v1.1.test.js'
      - 'scoring-v1.2.test.js'
      - 'scoring-v1.3-quality.test.js'
      - 'scoring-v1.4-industry.test.js'
      - 'calibrate-v1.1.js'
      - 'calibrate-v1.2.js'
      - '.github/workflows/board-check.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout board
        uses: actions/checkout@v4
      - name: Checkout live job source
        uses: actions/checkout@v4
        with:
          repository: lizhenhai2024-alt/AI_Job
          path: AI_Job
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check scoring syntax
        run: |
          node --check scoring.js
          node --check logic-correctness.js
      - name: Check app, API and Career Fit syntax
        run: |
          node --check app.js
          node --check app-core.js
          node --check app-loader.test.cjs
          node --check api/jobs.js
          node --check api/jobs.test.cjs
          node --check career-fit.js
          node --check career-personalization.js
      - name: Run ranked loading tests
        run: |
          node app-loader.test.cjs
          node api/jobs.test.cjs
      - name: Run Career Fit regression tests
        run: |
          node career-fit.test.js
          node career-personalization.test.js
      - name: Check calibration and intelligence audit syntax
        run: |
          node --check calibrate-v1.1.js
          node --check calibrate-v1.2.js
          node --check audit-intelligence-v1.3.cjs
          node --check audit-regression.cjs
      - name: Run scoring boundary tests
        run: |
          node scoring-v1.1.test.js
          node scoring-v1.2.test.js
          node scoring-v1.3-quality.test.js
          node scoring-v1.4-industry.test.js
      - name: Calibrate against current live job pool
        run: node calibrate-v1.2.js AI_Job/src/data/live-jobs.js
      - name: Audit S-A-B intelligence coverage
        run: node audit-intelligence-v1.3.cjs AI_Job
      - name: Regression audit - language gate & translation scoring
        run: node audit-regression.cjs AI_Job
      - name: Verify intelligence source files exist
        shell: bash
        run: |
          set -euo pipefail
          check() { local label="$1"; shift; if "$@"; then echo "PASS: $label"; else echo "::error::$label"; exit 1; fi; }
          check "company risk history exists" test -f AI_Job/src/data/company-risk-history.js
          check "priority risk history exists" test -f AI_Job/src/data/company-risk-history-priority.js
          check "company risk core exists" test -f AI_Job/src/core/company-risk.js
          check "compensation core exists" test -f AI_Job/src/core/compensation.js
          check "compensation enrichment exists" test -f AI_Job/scripts/enrich-job-compensation.mjs
          check "monthly salary wiring exists" grep -q 'monthlySalary' AI_Job/src/core/compensation.js
          check "annual salary wiring exists" grep -q 'annualSalary' AI_Job/src/core/compensation.js
          check "company risk history export exists" grep -q 'companyRiskHistory' AI_Job/src/data/company-risk-history.js
          check "priority company risk history export exists" grep -q 'priorityCompanyRiskHistory' AI_Job/src/data/company-risk-history-priority.js
          check "merged risk history wiring exists" grep -q 'mergedCompanyRiskHistory' AI_Job/src/core/company-risk.js
      - name: Verify production wiring
        shell: bash
        run: |
          set -euo pipefail
          check() { local label="$1"; shift; if "$@"; then echo "PASS: $label"; else echo "::error::$label"; exit 1; fi; }
          check "index.html is non-empty" test -s index.html
          check "app bootstrap is non-empty" test -s app.js
          check "app core is non-empty" test -s app-core.js
          check "logic correctness layer exists" test -s logic-correctness.js
          check "ranked endpoint exists" test -s api/jobs.js
          check "ranked endpoint test exists" test -s api/jobs.test.cjs
          check "bootstrap calls ranked top100 endpoint" grep -q "TOP_JOBS_URL='/api/jobs?limit=100'" app.js
          check "browser payload remains capped at 100" grep -q 'MAX_JOBS=100' app.js
          check "live-jobs refresh is guarded by ranked payload" grep -q 'installTop100FetchGuard' app.js
          check "logic patch loads before app core" grep -q "LOGIC_PATCH_URL='/logic-correctness.js'" app.js
          check "healthy live path disables curated merge" grep -q 'root.YINGZHUAN_JOBS=\[\]' app.js
          check "API response remains capped at 100" grep -q 'MAX_LIMIT=100' api/jobs.js
          check "API parses complete upstream pool" grep -q 'const jobs=parseJobs(text);' api/jobs.js
          check "API ranks full candidate pool" grep -q 'selectTopJobs(source.jobs' api/jobs.js
          check "API uses board scoring" grep -q "require('../scoring.js')" api/jobs.js
          check "API uses strict logic layer" grep -q "require('../logic-correctness.js')" api/jobs.js
          check "full snapshot is removed" bash -c "! find data -maxdepth 1 -type f -name 'snapshot-*.html' | grep -q ."
          check "app no longer references full snapshot" bash -c "! grep -q 'SNAPSHOT_URL\|snapshot-e316bc7' app.js"
          check "bootstrap references app core" grep -q "APP_CORE_URL='/app-core.js'" app.js
          check "bootstrap keeps curated jobs for fallback" grep -q 'YINGZHUAN_JOBS' app.js
          if grep -Eq '<script[^>]+scoring-v1\.1\.js' index.html; then
            echo "::error::legacy scoring-v1.1.js must not be wired in production"; exit 1
          else echo "PASS: legacy scoring-v1.1.js is not wired"; fi
          if grep -q 'scoring.js' index.html && grep -q 'app.js' index.html; then
            echo "PASS: index loads scoring.js and app bootstrap"; WIRING_FILE=app-core.js
          else echo "::error::production index must load scoring.js and app.js"; exit 1; fi
          check "priority risk source is wired" grep -q 'company-risk-history-priority.js' "$WIRING_FILE"
          check "priority risk export is consumed" grep -q 'priorityCompanyRiskHistory' "$WIRING_FILE"
          check "risk source guide is present" grep -q 'RISK_SOURCE_GUIDE' "$WIRING_FILE"
          check "CampusShame source guidance is present" grep -q 'CampusShame' "$WIRING_FILE"
          check "Nowcoder source guidance is present" grep -q '牛客' "$WIRING_FILE"
          check "Maimai source guidance is present" grep -q '脉脉' "$WIRING_FILE"
          check "community evidence disclaimer is present" grep -q '默认按 C 级二手社区线索处理' "$WIRING_FILE"
          if grep -q 'CareerFit2027' scoring.js; then
            echo "::error::base scoring engine must not depend on Career Fit"; exit 1
          else echo "PASS: base scoring engine remains independent from Career Fit"; fi
          check "Career Fit runtime exists" test -s career-fit.js
          check "Career personalization runtime exists" test -s career-personalization.js
          check "Career Fit loader is wired" grep -q "script.src = 'career-fit.js'" company-hc-salary.js
          check "Career personalization loader is wired" grep -q "p.src = 'career-personalization.js'" company-hc-salary.js
          check "personalization uses 60 percent activation gate" grep -q 'MIN_COMPLETION=60' career-personalization.js
          check "personalization uses direction-level 60 percent gate" grep -q 'MIN_DIRECTION_COMPLETION=60' career-personalization.js