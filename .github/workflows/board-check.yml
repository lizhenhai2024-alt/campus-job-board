name: Check campus job board

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app-v1.1.js'
      - 'scoring-v1.1.js'
      - 'scoring-v1.1-language-patch.js'
      - 'scoring-v1.2-calibration-patch.js'
      - 'scoring-v1.3-quality-patch.js'
      - 'ui-v1.2-patch.js'
      - 'intelligence-v1.3-patch.js'
      - 'audit-intelligence-v1.3.cjs'
      - 'scoring-v1.1.test.js'
      - 'scoring-v1.2.test.js'
      - 'scoring-v1.3-quality.test.js'
      - 'calibrate-v1.1.js'
      - 'calibrate-v1.2.js'
      - '.github/workflows/board-check.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout board
        uses: actions/checkout@v4
      - name: Checkout live job source
        uses: actions/checkout@v4
        with:
          repository: lizhenhai2024-alt/AI_Job
          path: AI_Job
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check scoring syntax
        run: |
          node --check scoring-v1.1.js
          node --check scoring-v1.1-language-patch.js
          node --check scoring-v1.2-calibration-patch.js
          node --check scoring-v1.3-quality-patch.js
      - name: Check app and UI syntax
        run: |
          node --check app-v1.1.js
          node --check ui-v1.2-patch.js
          node --check intelligence-v1.3-patch.js
      - name: Check calibration and intelligence audit syntax
        run: |
          node --check calibrate-v1.1.js
          node --check calibrate-v1.2.js
          node --check audit-intelligence-v1.3.cjs
      - name: Run scoring boundary tests
        run: |
          node scoring-v1.1.test.js
          node scoring-v1.2.test.js
          node scoring-v1.3-quality.test.js
      - name: Calibrate V1.2 against current live job pool
        run: node calibrate-v1.2.js AI_Job/src/data/live-jobs.js
      - name: Audit S-A-B intelligence coverage
        run: node audit-intelligence-v1.3.cjs AI_Job
      - name: Verify intelligence source files exist
        run: |
          test -f AI_Job/src/data/company-risk-history.js
          test -f AI_Job/src/core/compensation.js
          test -f AI_Job/scripts/enrich-job-compensation.mjs
          grep -q 'monthlySalary' AI_Job/src/core/compensation.js
          grep -q 'annualSalary' AI_Job/src/core/compensation.js
          grep -q 'companyRiskHistory' AI_Job/src/data/company-risk-history.js
      - name: Verify production wiring
        run: |
          grep -q 'scoring-v1.1.js' index.html
          grep -q 'scoring-v1.1-language-patch.js' index.html
          grep -q 'scoring-v1.2-calibration-patch.js' index.html
          grep -q 'scoring-v1.3-quality-patch.js' index.html
          grep -q 'app-v1.1.js' index.html
          grep -q 'ui-v1.2-patch.js' index.html
          grep -q 'intelligence-v1.3-patch.js' index.html
          ! grep -q 'CampusScoring=' intelligence-v1.3-patch.js
