name: Career Fit V1.2 Check

on:
  pull_request:
    paths:
      - 'career-fit.js'
      - 'career-personalization.js'
      - 'career-fit.test.js'
      - 'career-personalization.test.js'
      - 'company-hc-salary.js'
      - '.github/workflows/career-fit-check.yml'
  push:
    branches: [main]
    paths:
      - 'career-fit.js'
      - 'career-personalization.js'
      - 'career-fit.test.js'
      - 'career-personalization.test.js'
      - 'company-hc-salary.js'
      - '.github/workflows/career-fit-check.yml'

jobs:
  career-fit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check
        run: |
          node --check career-fit.js
          node --check career-personalization.js
      - name: Regression tests
        run: |
          node career-fit.test.js
          node career-personalization.test.js
      - name: Wiring invariants
        run: |
          test -s career-fit.js
          test -s career-personalization.js
          grep -q "script.src = 'career-fit.js'" company-hc-salary.js
          grep -q "p.src = 'career-personalization.js'" company-hc-salary.js
          grep -q 'MIN_COMPLETION=60' career-personalization.js
          if grep -q 'CareerFit2027' scoring.js; then
            echo 'Base scoring engine must remain independent from Career Fit'
            exit 1
          fi
