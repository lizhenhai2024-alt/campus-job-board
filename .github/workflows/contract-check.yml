name: Verify risk intelligence contract

# 本仓库负责决策/评分契约；AI_Job 只提供岗位事实。
on:
  push:
    branches: [main]
    paths:
      - 'risk-intelligence.json'
      - 'scoring.js'
      - 'query-layer-adapter.js'
      - 'query-layer-adapter.test.js'
      - 'scripts/**'
      - 'scoring-v1.1.test.js'
      - 'scoring-v1.2.test.js'
      - 'scoring-v1.3-quality.test.js'
      - 'scoring-v1.4-industry.test.js'
      - 'calibrate-v1.1.js'
      - 'calibrate-v1.2.js'
      - 'audit-intelligence-v1.3.cjs'
      - 'audit-regression.cjs'
      - '.github/workflows/contract-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'risk-intelligence.json'
      - 'scoring.js'
      - 'query-layer-adapter.js'
      - 'query-layer-adapter.test.js'
      - 'scripts/**'
      - 'scoring-v1.1.test.js'
      - 'scoring-v1.2.test.js'
      - 'scoring-v1.3-quality.test.js'
      - 'scoring-v1.4-industry.test.js'
      - 'calibrate-v1.1.js'
      - 'calibrate-v1.2.js'
      - 'audit-intelligence-v1.3.cjs'
      - 'audit-regression.cjs'
      - '.github/workflows/contract-check.yml'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout contract repo
        uses: actions/checkout@v4
      - name: Checkout live job source
        uses: actions/checkout@v4
        with:
          repository: lizhenhai2024-alt/AI_Job
          path: AI_Job
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check kernel and adapter syntax
        run: |
          node --check scoring.js
          node --check query-layer-adapter.js
          node --check query-layer-adapter.test.js
      - name: Verify kernel is self-contained
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          for dep in career-fit career-personalization company-hc-salary logic-correctness app-core shortlist yingzhuan-jobs; do
            if grep -q "$dep" scoring.js; then
              echo "::error::scoring.js 反向依赖了已摘除的 UI 模块：$dep"
              fail=1
            fi
          done
          [ "$fail" = 0 ] && echo "PASS: scoring.js 不依赖任何已摘除的 UI 模块"
          exit "$fail"
      - name: Verify contract matches scoring.js
        run: node scripts/check-risk-contract.cjs
      - name: Run scoring boundary tests
        run: |
          node scoring-v1.1.test.js
          node scoring-v1.2.test.js
          node scoring-v1.3-quality.test.js
          node scoring-v1.4-industry.test.js
          node query-layer-adapter.test.js
      - name: Verify AI_Job Query Layer exists and stays fact-only
        shell: bash
        run: |
          set -euo pipefail
          test -s AI_Job/jobs/index/companies.json
          test -s AI_Job/jobs/index/jobs.json
          node - <<'NODE'
          const fs=require('fs');
          const q=JSON.parse(fs.readFileSync('AI_Job/jobs/index/jobs.json','utf8'));
          if(q.schemaVersion!==1 || !Array.isArray(q.jobs) || q.totalJobs!==q.jobs.length) throw new Error('invalid Query Layer');
          const forbidden=['matchScore','match_score','capabilityScore','capability','careerFit','career_fit','decisionScore','decision_score','decisionBucket','decision_bucket','grade','recommendation'];
          for(const [i,j] of q.jobs.entries()) for(const k of forbidden) if(Object.prototype.hasOwnProperty.call(j,k)) throw new Error(`upstream decision leak ${k} @${i}`);
          console.log(`PASS Query Layer jobs=${q.totalJobs}`);
          NODE
      - name: Verify declared risk sources exist upstream
        shell: bash
        run: |
          set -euo pipefail
          node -e '
            const c = require("./risk-intelligence.json");
            for (const s of c.riskSources.sources) {
              for (const u of s.urls) {
                const m = String(u).match(/^https:\/\/raw\.githubusercontent\.com\/[^/]+\/[^/]+\/[^/]+\/(.+)$/);
                if (!m) continue;
                console.log("PATH\t" + s.exportName + "\t" + m[1]);
              }
            }
          ' | while IFS=$'\t' read -r tag name rel; do
            [ "$tag" = "PATH" ] || continue
            [ -f "AI_Job/$rel" ] && echo "PASS: $name -> AI_Job/$rel" || { echo "::error::上游文件不存在：AI_Job/$rel"; exit 1; }
          done
          for n in companyRiskHistory priorityCompanyRiskHistory; do
            grep -rq "export const $n" AI_Job/src/data/ 2>/dev/null && echo "PASS: 上游导出 $n 存在" || { echo "::error::上游找不到导出 $n"; exit 1; }
          done
      - name: Calibrate against current live job pool
        run: node calibrate-v1.2.js AI_Job/src/data/live-jobs.js
      - name: Audit S-A-B intelligence coverage
        run: node audit-intelligence-v1.3.cjs AI_Job
      - name: Regression audit - language gate & translation scoring
        run: node audit-regression.cjs AI_Job
